name: Backend CI

on:
  push:
    branches: [ karsajobs ]
  pull_request:
    branches: [ karsajobs ]

jobs:
  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Install hadolint
      run: |
        # Download hadolint dan berikan izin eksekusi
        sudo wget -O /bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
        sudo chmod +x /bin/hadolint
    
    - name: Run hadolint
      run: |
        # Jalankan hadolint untuk memeriksa Dockerfile
        hadolint Dockerfile

  test-app:
    needs: lint-dockerfile
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '1.19'
    
    - name: Run tests
      run: |
        # Jalankan unit test untuk backend Go
        go test -v -short --count=1 $(go list ./...)

  build-app-karsajobs:
    needs: test-app
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  
    steps:
    - uses: actions/checkout@v3
    
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: cornel-yr
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      run: |
        # Berikan izin eksekusi pada script build dan push
        chmod +x build_push_image_karsajobs.sh
        # Jalankan script build dan push
        ./build_push_image_karsajobs.sh
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}